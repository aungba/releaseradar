description: Docs, tests and lockfile only. Must short-circuit without an LLM call.
files:
  - path: README.md
    patch: |
      @@ -1,3 +1,5 @@
       # Billing service
      +
      +See docs/runbook.md for on-call procedures.
  - path: docs/runbook.md
    status: ADDED
    patch: |
      @@ -0,0 +1,3 @@
      +# Runbook
      +
      +Restart the worker with `make restart-worker`.
  - path: tests/test_invoices.py
    patch: |
      @@ -12,3 +12,6 @@ def test_invoice_total() -> None:
           assert invoice.total_cents == 1200
      +
      +def test_invoice_empty() -> None:
      +    assert Invoice(lines=[]).total_cents == 0
  - path: package-lock.json
    patch: |
      @@ -1,3 +1,3 @@
       {
      -  "lockfileVersion": 2,
      +  "lockfileVersion": 3,
expected:
  verdict: [APPROVED]
  rollback_safe: true
  hazards: []
