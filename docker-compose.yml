services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: releaseradar
      POSTGRES_PASSWORD: releaseradar
      POSTGRES_DB: releaseradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseradar -d releaseradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      RR_DATABASE_URL: postgresql+asyncpg://releaseradar:releaseradar@postgres:5432/releaseradar
      RR_REDIS_URL: redis://redis:6379/0
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      RR_DATABASE_URL: postgresql+asyncpg://releaseradar:releaseradar@postgres:5432/releaseradar
      RR_REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
