name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: releaseradar
          POSTGRES_PASSWORD: releaseradar
          POSTGRES_DB: releaseradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U releaseradar"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      RR_TEST_DATABASE_URL: postgresql+asyncpg://releaseradar:releaseradar@localhost:5432/releaseradar_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
